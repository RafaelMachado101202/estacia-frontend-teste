<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>estacIA - Recuperar Senha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: linear-gradient(180deg, #0d47a1 0%, #1565c0 50%, #0a2540 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .card-container {
      background-color: #ffffff;
      width: 100%;
      max-width: 360px;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      transition: all 0.3s ease;
    }

    @media (min-width: 768px) {
      .card-container {
        max-width: 580px;
        border-radius: 28px;
      }
      .header-bege {
        padding: 40px 32px 28px 32px !important;
      }
      .brand-logo {
        font-size: 30px !important;
      }
      .header-title {
        font-size: 22px !important;
      }
      .header-subtitle {
        font-size: 14px !important;
        max-width: 100% !important;
      }
      .form-body {
        padding: 32px !important;
        gap: 20px !important;
      }
      .input-label {
        font-size: 14px !important;
      }
      .input-box {
        padding: 14px 16px !important;
        font-size: 15px !important;
        border-radius: 12px !important;
      }
      .btn-submit {
        padding: 16px !important;
        font-size: 16px !important;
        border-radius: 12px !important;
      }
      .footer-text {
        font-size: 13px !important;
      }
    }

    .header-bege {
      background-color: #f7f3ed;
      padding: 32px 24px 20px 24px;
      text-align: center;
    }

    .brand-logo {
      font-size: 22px;
      font-weight: 700;
      color: #1565c0;
      margin-bottom: 12px;
      letter-spacing: -0.3px;
    }

    .brand-logo span {
      color: #000000;
    }

    .header-title {
      font-size: 18px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 4px;
    }

    .header-subtitle {
      font-size: 11px;
      color: #757575;
      line-height: 1.3;
      max-width: 220px;
      margin: 0 auto;
    }

    .form-body {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-label {
      font-size: 12px;
      font-weight: 600;
      color: #424242;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .input-box {
      width: 100%;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 13px;
      color: #333333;
      outline: none;
      background-color: #ffffff;
    }

    .input-box:focus {
      border-color: #1565c0;
    }

    .btn-submit {
      width: 100%;
      background-color: #1565c0;
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
      box-shadow: 0 2px 6px rgba(21, 101, 192, 0.2);
    }

    .footer-text {
      text-align: center;
      font-size: 11px;
      color: #666666;
    }

    .footer-text a {
      color: #1565c0;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="card-container">
    
    <div class="header-bege">
      <div class="brand-logo">estac<span>IA</span></div>
      <h2 class="header-title">Recuperar Senha</h2>
      <p class="header-subtitle">Digite seu e-mail para receber as instruções de redefinição</p>
    </div>

    <form class="form-body" onsubmit="event.preventDefault(); alert('Instruções enviadas para o e-mail cadastrado!'); window.location.href='index.html';">
      
      <div class="input-group">
        <label class="input-label">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          E-mail cadastrado
        </label>
        <input type="email" class="input-box" placeholder="seu@email.com" required />
      </div>

      <button type="submit" class="btn-submit">Enviar Instruções</button>

      <div class="footer-text">
        Lembrou da senha? <a href="index.html">Voltar ao Login</a>
      </div>

    </form>

  </div>

</body>
</html>
